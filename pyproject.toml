[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-bolsa"
description = "Sistema multiagente con CrewAI para investigar, simular y operar bolsa americana con controles de riesgo."
requires-python = ">=3.10,<3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "crewai>=1.14.0,<2.0.0",
    "crewai-tools",
    "openai>=1.13.3",
    "jiter==0.13.0",
    "alpaca-py>=0.43.0",
    "yfinance>=0.2.50",
    "cffi>=1.16.0,<3.0.0",
    "pandas>=2.2.0",
    "lxml>=5.0.0,<6.0.0",
    "numpy>=1.26.0",
    "ta>=0.11.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.1",
    "APScheduler>=3.10.4",
    "pandas-market-calendars>=4.4.0",
    "tenacity>=8.2.3",
    "orjson>=3.10.0",
    "streamlit>=1.37.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "agente_bolsa.__version__"}

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# TODO(audit-D2): activar BLE001/C901 y reducir el baseline E501 por modulo;
# hoy son avisos de deuda y no deben bloquear CI.
ignore = ["BLE001", "C901", "E501"]

[tool.ruff.lint.per-file-ignores]
# El dashboard degrada imports opcionales de Streamlit/Altair antes de cargar
# sus modulos internos; reordenarlos cambiaria su comportamiento import-only.
"src/agente_bolsa/web_app.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
